services:
  # ============================================================================
  # Servis 1: Middleware Python MLLP Listener (Penerima HL7 dari PACS)
  # ============================================================================
  pacs-middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: pacs-middleware
    restart: always
    ports:
      - "${MLLP_PORT:-2575}:${MLLP_PORT:-2575}"   # Expose port MLLP ke jaringan RS
    environment:
      - MLLP_HOST=0.0.0.0
      - MLLP_PORT=${MLLP_PORT:-2575}
      - SIMGOS_API_BASE_URL=${SIMGOS_API_BASE_URL:-http://simgos-api/api/v1}
      - SIMGOS_AUTH_TYPE=${SIMGOS_AUTH_TYPE:-api_key}
      - SIMGOS_API_KEY=${SIMGOS_API_KEY:?SIMGOS_API_KEY wajib diisi di .env}
      - SIMGOS_API_TIMEOUT=${SIMGOS_API_TIMEOUT:-15}
      - SIMGOS_API_MAX_RETRIES=${SIMGOS_API_MAX_RETRIES:-3}
      # Store-and-forward: antrean lokal SQLite di volume persisten /app/data
      - SPOOL_DB_PATH=${SPOOL_DB_PATH:-/app/data/spool.db}
      - SPOOL_INTERVAL_SECONDS=${SPOOL_INTERVAL_SECONDS:-30}
      - SPOOL_MAX_RETRIES=${SPOOL_MAX_RETRIES:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./middleware/logs:/app/logs               # Persistensi log ke host
      - ./middleware/data:/app/data               # Antrean lokal (spool.db) — tetap ada walau kontainer restart
    depends_on:
      - simgos-api
    # Riwayat PUT/POST dibaca lewat `docker logs`. Rotasi wajib agar
    # json-file tidak tumbuh tanpa batas: 5 x 10 MB = 50 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - pacs-bridge-net

  # ============================================================================
  # Servis 2: SIMGOS REST API Endpoint (PHP 8.2 + Apache)
  # ============================================================================
  simgos-api:
    build:
      context: ./simgos-api
      dockerfile: Dockerfile
    container_name: simgos-api
    restart: always
    ports:
      - "${SIMGOS_API_HOST_PORT:-8080}:80"        # Expose port HTTP ke host (port 8080)
    environment:
      - SIMGOS_DB_HOST=${SIMGOS_DB_HOST:-host.docker.internal}
      - SIMGOS_DB_PORT=${SIMGOS_DB_PORT:-3306}
      - SIMGOS_DB_NAME=${SIMGOS_DB_NAME:-}
      - SIMGOS_DB_USER=${SIMGOS_DB_USER:-root}
      - SIMGOS_DB_PASS=${SIMGOS_DB_PASS:-}
      - SIMGOS_API_KEY=${SIMGOS_API_KEY:?SIMGOS_API_KEY wajib diisi di .env}
      - SIMGOS_API_LOG_FILE=/var/log/simgos/simgos_api.log   # Di luar DocumentRoot
    volumes:
      - ./simgos-api/logs:/var/log/simgos         # Persistensi log ke host
    extra_hosts:
      - "host.docker.internal:host-gateway"       # Kompatibilitas akses host MySQL
    # Apache access log (stdout) juga memuat baris PUT/POST. Rotasi sama.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - pacs-bridge-net

# ==============================================================================
# Jaringan Privat Antar-Kontainer
# ==============================================================================
networks:
  pacs-bridge-net:
    driver: bridge
